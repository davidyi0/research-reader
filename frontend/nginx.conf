# Docker's embedded DNS (127.0.0.11) + resolving the upstream via a
# variable, not a bare proxy_pass hostname, matters here: nginx otherwise
# resolves "api" once at startup, so it refuses to start if the api
# container isn't already up yet, and won't notice if api's container IP
# changes later (e.g. after a restart) until nginx itself restarts.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $api_upstream http://api:8000;

    # Proxy the backend's routes to the api container so only port 80 needs
    # to be public — the frontend is built with VITE_API_URL="" (same
    # origin), so these are exactly the paths the browser will request.
    location /health {
        proxy_pass $api_upstream;
    }
    location /auth {
        proxy_pass $api_upstream;
    }
    location /papers {
        proxy_pass $api_upstream;
        # /explain is SSE — don't let nginx buffer the stream, or TTFT (the
        # whole point of the streaming design) gets destroyed. The backend
        # already sends X-Accel-Buffering: no; this makes sure nginx honors
        # it even without buffering enabled by default.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: client-side routing has no matching file on the server,
    # so unknown paths (e.g. a refresh mid-route) must still serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
