# local dev stack

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studylens}
      POSTGRES_DB: ${POSTGRES_DB:-studylens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `api` waits until Postgres actually accepts connections, not just "container started".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studylens}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    # host.docker.internal lets LLM_BASE_URL point at a locally-running Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app        # bind mount -> uvicorn --reload sees code edits live
      # Storage lives OUTSIDE /app on purpose: uvicorn --reload watches /app, so
      # writing an ingested PDF under it would restart the API mid-request.
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Dev server only. The production static build stays deferred to P7; this
  # exists so localhost:5173 is always up rather than needing a spare terminal.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Shadows the host's Windows-built node_modules, whose native binaries
      # (esbuild, rollup) can't run in a Linux container.
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
